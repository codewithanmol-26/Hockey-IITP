<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hockey Attendance</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header><h1>Inter IIT Hockey · Attendance</h1><button id="auth">Captain login</button></header>
<nav id="nav"></nav>
<main id="view"></main>
<dialog id="dlg"><form id="lf"><h2>Captain / vice-captain login</h2>
<p><select id="em"><option value="captain">Captain: Rachit Singh Rathore</option><option value="vice">Vice-captain: Sachin Kumar</option></select></p>
<p><input id="pw" type="password" inputmode="numeric" placeholder="Your code" autocomplete="off" required></p>
<p id="er" class="mute"></p>
<div class="ctl"><button class="pri">Log in</button><button type="button" id="cx">Cancel</button></div></form></dialog>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
